<!doctype html>
<!-- Scene 1 card: a fictional incoming call. Recorded at 1920x1080 by record.mjs.
     Query: ?note=<lower-third text>&noteAt=<seconds> (omit note to hide the lower-third). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Incoming call</title>
<style>
  :root { --bg: #14181f; --text: #eceae6; --muted: #a9afb6; --accent: #6fd6ad; --warm: #ffa47c; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; background: var(--bg); color: var(--text);
    font-family: Inter, "DejaVu Sans", sans-serif; overflow: hidden; }
  .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding-bottom: 300px; }
  .label { font-size: 34px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .ring { position: relative; width: 260px; height: 260px; display: grid; place-items: center; margin: 40px 0 20px; }
  .ring span { position: absolute; inset: 0; border-radius: 50%; border: 4px solid var(--accent); opacity: 0;
    animation: pulse 2.2s ease-out infinite; }
  .ring span:nth-child(2) { animation-delay: 0.73s; }
  .ring span:nth-child(3) { animation-delay: 1.46s; }
  @keyframes pulse { 0% { transform: scale(0.55); opacity: 0.9; } 100% { transform: scale(1.35); opacity: 0; } }
  .avatar { width: 150px; height: 150px; border-radius: 50%; background: #232a33; border: 3px solid #3a434e;
    display: grid; place-items: center; font-size: 56px; font-weight: 700; z-index: 1; }
  .who { font-size: 76px; font-weight: 700; line-height: 1.1; }
  .sub { font-size: 36px; color: var(--muted); }
  .buttons { display: flex; gap: 220px; margin-top: 50px; }
  .btn { width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; }
  .btn svg { width: 56px; height: 56px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .decline { background: #c2412d; } .decline svg { transform: rotate(135deg); }
  .accept { background: #1f8a5b; animation: nudge 1.1s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateY(-10px); } }
  .tag { font-size: 26px; color: var(--muted); margin-top: 6px; }
  .lower { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%);
    background: rgba(255,255,255,0.08); border-left: 6px solid var(--warm); border-radius: 10px;
    padding: 18px 30px; font-size: 32px; color: var(--text); opacity: 0; white-space: nowrap; }
  .lower.show { animation: fadein 0.5s ease-out forwards; animation-delay: var(--note-at, 12s); }
  @keyframes fadein { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
</head>
<body>
  <div class="stage">
    <div class="label">Incoming call</div>
    <div class="ring"><span></span><span></span><span></span><div class="avatar">KB</div></div>
    <div class="who">Kestrel Bank Security</div>
    <div class="sub">Mobile · Fictional caller</div>
    <div class="buttons">
      <div><div class="btn decline"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.7a16 16 0 0 0 6.2 6.2l1.2-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></div></div>
      <div><div class="btn accept"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.7a16 16 0 0 0 6.2 6.2l1.2-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></div></div>
    </div>
  </div>
  <div class="lower" id="note"></div>
  <script>
    const q = new URLSearchParams(location.search);
    const note = q.get("note");
    if (note) {
      const el = document.getElementById("note");
      el.textContent = note;
      el.style.setProperty("--note-at", `${parseFloat(q.get("noteAt") || "12")}s`);
      el.classList.add("show");
    }
  </script>
</body>
</html>
