<!doctype html>
<!-- Scene 9 end card. Recorded at 1920x1080 by record.mjs.
     Query: ?url=<deployed url>&repo=<repo url>&voice=<voiceover credit, optional> -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scam Gym</title>
<style>
  :root { --bg: #14181f; --text: #eceae6; --muted: #a9afb6; --accent: #6fd6ad; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; background: var(--bg); color: var(--text);
    font-family: Inter, "DejaVu Sans", sans-serif; overflow: hidden; }
  .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 120px; text-align: center; }
  svg { width: 130px; height: 130px; fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.02em; margin-top: 18px; }
  .tag { font-size: 48px; color: var(--muted); margin-top: 10px; }
  .links { margin-top: 64px; display: grid; gap: 16px; }
  .url { font-size: 50px; color: var(--accent); font-weight: 600; }
  .repo { font-size: 36px; color: var(--text); }
  .built { font-size: 30px; color: var(--muted); margin-top: 56px; }
  .small { font-size: 24px; color: #858c94; margin-top: 12px; }
</style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
    <h1>Scam Gym</h1>
    <p class="tag">Practice the call before the scammer makes it.</p>
    <div class="links">
      <p class="url" id="url"></p>
      <p class="repo" id="repo"></p>
    </div>
    <p class="built">Built Oct 17 to Nov 22, 2026 with AI coding assistance (Claude Code).</p>
    <p class="small" id="voice"></p>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const strip = (u) => (u || "").replace(/^https?:\/\//, "");
    document.getElementById("url").textContent = strip(q.get("url")) || "DEPLOYED_URL MISSING";
    document.getElementById("repo").textContent = strip(q.get("repo")) || "REPO_URL MISSING";
    document.getElementById("voice").textContent = q.get("voice") ? `Voiceover generated with ${q.get("voice")}.` : "";
  </script>
</body>
</html>
